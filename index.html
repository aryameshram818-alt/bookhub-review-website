<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Review Website</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #f4f4f4; }
    .hero { background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') no-repeat center/cover; height: 40vh; display:flex; justify-content:center; align-items:center; color:white; text-shadow:2px 2px 5px black; }
    .card-img-top { height:300px; object-fit:cover; }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">BookReviewHub</a>
  </div>
</nav>

<header class="text-center text-white p-5 hero">
  <h1>Discover Your Next Favorite Book</h1>
</header>

<div class="container mt-4">
  <h2 class="text-center mb-4">Latest Books</h2>
  <div class="row" id="book-list"></div>
</div>

<script>
// Hardcoded books array
const books = [
    {id:1, title:"Atomic Habits", author:"James Clear", genre:"Self Help", rating:"4.5", image:"https://m.media-amazon.com/images/I/81WcnNQ-TBL.jpg", description:"A guide on building good habits and breaking bad ones."},
    {id:2, title:"The Alchemist", author:"Paulo Coelho", genre:"Fiction", rating:"5", image:"https://m.media-amazon.com/images/I/71aFt4+OTOL.jpg", description:"A story about following your dreams."},
    {id:3, title:"Rich Dad Poor Dad", author:"Robert Kiyosaki", genre:"Finance", rating:"4", image:"https://m.media-amazon.com/images/I/81gepf1eMqL.jpg", description:"A book on financial education."},
    {id:4, title:"To Kill a Mockingbird", author:"Harper Lee", genre:"Classic Fiction", rating:"4.8", image:"https://m.media-amazon.com/images/I/81OthjkJBuL.jpg", description:"A timeless novel addressing racial injustice and moral growth."},
    {id:5, title:"The Power of Now", author:"Eckhart Tolle", genre:"Spirituality", rating:"4.6", image:"https://m.media-amazon.com/images/I/51d7LooDKlL._SL1000_.jpg", description:"A guide to living fully in the present moment."},
    {id:6, title:"1984", author:"George Orwell", genre:"Dystopian", rating:"4.7", image:"https://m.media-amazon.com/images/I/71kxa1-0mfL.jpg", description:"A chilling dystopian novel exploring government control."},
    {id:7, title:"Sapiens: A Brief History of Humankind", author:"Yuval Noah Harari", genre:"History", rating:"4.6", image:"https://m.media-amazon.com/images/I/713jIoMO3UL.jpg", description:"Exploration of the history and impact of Homo sapiens."},
    {id:8, title:"The Subtle Art of Not Giving a F*ck", author:"Mark Manson", genre:"Self Help", rating:"4.4", image:"https://m.media-amazon.com/images/I/71QKQ9mwV7L.jpg", description:"A no-nonsense approach to living a better life."},
    {id:9, title:"Pride and Prejudice", author:"Jane Austen", genre:"Classic Fiction", rating:"4.5", image:"https://m.media-amazon.com/images/I/81Y5vEXNcBL._SL1500_.jpg", description:"A romantic classic exploring love and society."},
    {id:10, title:"Thinking, Fast and Slow", author:"Daniel Kahneman", genre:"Psychology", rating:"4.7", image:"https://m.media-amazon.com/images/I/51xIBSZzFrL._SL1000_.jpg", description:"A deep dive into human thinking and decision-making."}
];

// Load reviews from localStorage
let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

const bookList = document.getElementById("book-list");

function renderBooks() {
    bookList.innerHTML = "";

    books.forEach(book => {
        const bookReviews = reviews.filter(r => r.bookId === book.id);

        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";

        card.innerHTML = `
            <div class="card shadow">
                <img src="${book.image}" class="card-img-top" alt="Book Image">
                <div class="card-body">
                    <h5 class="card-title">${book.title}</h5>
                    <p><strong>Author:</strong> ${book.author}</p>
                    <p><strong>Genre:</strong> ${book.genre}</p>
                    <p><strong>Rating:</strong> ⭐ ${book.rating}</p>
                    <p>${book.description}</p>
                    <h6>Reviews:</h6>
                    <div id="reviews-${book.id}">
                        ${bookReviews.length ? bookReviews.map(r => `<p><strong>${r.name}</strong> (⭐${r.rating})<br>${r.comment}</p>`).join("") : "<p>No reviews yet.</p>"}
                    </div>
                    <hr>
                    <h6>Add a Review:</h6>
                    <input type="text" id="name-${book.id}" class="form-control mb-2" placeholder="Your Name">
                    <select id="rating-${book.id}" class="form-select mb-2">
                        <option value="1">⭐ 1</option>
                        <option value="2">⭐ 2</option>
                        <option value="3">⭐ 3</option>
                        <option value="4">⭐ 4</option>
                        <option value="5">⭐ 5</option>
                    </select>
                    <textarea id="comment-${book.id}" class="form-control mb-2" placeholder="Write your review"></textarea>
                    <button class="btn btn-success btn-submit" data-id="${book.id}">Submit Review</button>
                </div>
            </div>
        `;

        bookList.appendChild(card);
    });

    // Add event listeners
    document.querySelectorAll(".btn-submit").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = parseInt(btn.getAttribute("data-id"));
            const name = document.getElementById(`name-${id}`).value;
            const rating = document.getElementById(`rating-${id}`).value;
            const comment = document.getElementById(`comment-${id}`).value;

            if(!name || !comment) { alert("Please enter your name and comment"); return; }

            reviews.push({bookId: id, name, rating, comment});
            localStorage.setItem("reviews", JSON.stringify(reviews));
            renderBooks(); // Re-render to update reviews
        });
    });
}

renderBooks();
</script>

</body>
</html>
