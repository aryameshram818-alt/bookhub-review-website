<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">Book Verse</div>
    <div class="search">
      <input type="text" placeholder="Search books..." id="searchInput"/>
      <button id="searchBtn">Search</button>
    </div>
  </div>
</header>

<div class="genres">
  <button class="genre-btn active" data-genre="All">All</button>
  <button class="genre-btn" data-genre="Fiction">Fiction</button>
  <button class="genre-btn" data-genre="Self‑help">Self‑help</button>
  <button class="genre-btn" data-genre="Motivation">Motivation</button>
  <button class="genre-btn" data-genre="Mystery">Mystery</button>
  <button class="genre-btn" data-genre="Sci‑Fi">Sci‑Fi</button>
</div>

<main class="cards-grid" id="booksContainer">
  <!-- Cards generated by JS -->
</main>

<div class="modal" id="reviewModal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">&times;</button>
    <h2 id="modalTitle"></h2>
    <p id="modalReview"></p>
  </div>
</div>

<footer>
  &copy; 2025 BookHub — All Rights Reserved
</footer>

<script src="script.js"></script>
</body>
</html>
